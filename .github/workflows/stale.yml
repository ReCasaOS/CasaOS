name: Close stale issues

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in
            14 days if nothing happens. Comment to keep it open.
          close-issue-message: >
            Closing due to inactivity. Comment to reopen if still relevant.
          exempt-issue-labels: "priority: high,help wanted,good first issue,needs-triage"
          # Only PRs are handled by a separate job elsewhere, if ever; stay on issues.
          days-before-pr-stale: -1
          days-before-pr-close: -1
          # Limit the first runs so the existing backlog is not flagged all at once.
          operations-per-run: 60
          # shortcut: only acts on issues updated on/after this date, so the old
          # backlog is left alone; remove this line to sweep everything.
          start-date: "2026-11-04T00:00:00Z"
