name: goreleaser

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish CasaOS packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Generate API clients
        run: go generate

      - name: Build release packages
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          output_dir=/tmp/casaos-release
          mkdir -p "$output_dir"

          build_target() {
            local target_arch="$1"
            local goarch="$2"
            local goarm="${3:-}"
            local stage_dir
            local output_file="$output_dir/linux-${target_arch}-casaos-${RELEASE_TAG}.tar.gz"

            stage_dir="$(mktemp -d)"
            mkdir -p "$stage_dir/build/sysroot/usr/bin"
            cp -a build "$stage_dir/"

            CGO_ENABLED=0 \
              GOOS=linux \
              GOARCH="$goarch" \
              GOARM="$goarm" \
              go build \
                -buildvcs=false \
                -trimpath \
                -tags "musl netgo osusergo" \
                -ldflags "-s -w -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/ReCasaOS/CasaOS/common.VERSION=${RELEASE_TAG#v}" \
                -o "$stage_dir/build/sysroot/usr/bin/casaos" \
                .

            tar -C "$stage_dir" -czf "$output_file" build
            rm -rf "$stage_dir"
          }

          build_target amd64 amd64
          build_target arm64 arm64
          build_target arm-7 arm 7
          (cd "$output_dir" && sha256sum *.tar.gz > checksums.txt)

      - name: Generate the SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: casaos-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            /tmp/casaos-release/*.tar.gz
            /tmp/casaos-release/checksums.txt

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            /tmp/casaos-release/*.tar.gz
            /tmp/casaos-release/checksums.txt
          sbom-path: casaos-${{ github.ref_name }}.spdx.json

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            /tmp/casaos-release/*.tar.gz
            /tmp/casaos-release/checksums.txt
            casaos-${{ github.ref_name }}.spdx.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
