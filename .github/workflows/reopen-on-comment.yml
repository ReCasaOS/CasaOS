name: Reopen on comment

# A closed issue gets reopened when someone from outside the team comments on it.
# Maintainers are skipped: they comment while closing ("fixed in vX") and must
# not reopen what they just closed. Bots are skipped for the same reason.
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reopen:
    if: >
      github.event.issue.state == 'closed' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - run: gh issue reopen "$NUMBER" --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
